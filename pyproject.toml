[project]
name = "rag-student-handbook"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-google-genai>=2.0.7",
    "langchain-community>=0.4.2",
    "langchain>=0.3.0",
    "langchain-experimental>=0.3.2",
    "langgraph>=0.2.0",
    "neo4j>=5.26.0",
    "qdrant-client>=1.7.0",
    "fastapi>=0.115.0",
    "slowapi>=0.1.9",
    "uvicorn>=0.32.0",
    "streamlit>=1.41.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "pydantic>=2.10.3",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1",
    "redis>=8.1.0",
    "celery>=5.4.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "reportlab>=4.2.5",
    "pypdf>=6.13.3",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src/main/python"]
