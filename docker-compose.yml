services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-student_handbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student_handbook_local}
      POSTGRES_DB: ${POSTGRES_DB:-student_handbook}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-student_handbook_local}
      NEO4J_dbms_default__database: ${NEO4J_DB:-neo4j}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    environment: &app_environment
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-student_handbook}:${POSTGRES_PASSWORD:-student_handbook_local}@postgres:5432/${POSTGRES_DB:-student_handbook}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-student_handbook}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-student_handbook_local}
      NEO4J_DB: ${NEO4J_DB:-neo4j}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-dangvantuan/vietnamese-embedding}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      TOP_K_RESULTS: ${TOP_K_RESULTS:-3}
      RETRIEVAL_RECALL_K: ${RETRIEVAL_RECALL_K:-20}
      GRAPH_INGESTION_ENABLED: ${GRAPH_INGESTION_ENABLED:-true}
      CORS_ORIGINS: http://localhost:8501
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-student_handbook}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A backend.workers.celery_worker.celery_app worker --loglevel=info
    environment: *app_environment
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      streamlit run frontend/streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501
      --browser.gatherUsageStats false
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
